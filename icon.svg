<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f6fff"/>
      <stop offset="55%" stop-color="#6d5bff"/>
      <stop offset="100%" stop-color="#3d2ba8"/>
    </linearGradient>
    <linearGradient id="petal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6e2ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- fundo -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- símbolo: "spark" de quatro pontas, com um acento em órbita -->
  <g transform="translate(256,256)">

    <!-- ponta vertical -->
    <path d="M 0,-146 C 22,-78 34,-30 34,0 C 34,30 22,78 0,146
             C -22,78 -34,30 -34,0 C -34,-30 -22,-78 0,-146 Z"
          fill="url(#petal)"/>

    <!-- ponta horizontal (mais curta, dá profundidade) -->
    <path d="M -110,0 C -58,-16 -22,-25 0,-25 C 22,-25 58,-16 110,0
             C 58,16 22,25 0,25 C -22,25 -58,16 -110,0 Z"
          fill="url(#petal)" opacity="0.92"/>

    <!-- núcleo -->
    <circle r="16" fill="#ffffff"/>

    <!-- acento em órbita: um pontinho girando, referência a "IA em movimento" -->
    <circle cx="118" cy="-118" r="17" fill="#ffffff" opacity="0.95"/>

  </g>
</svg>
